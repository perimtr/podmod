# Recommended Settings - playback, library and power defaults for this iPod mini.
# Load it under Settings > Manage Settings > Browse .cfg Files.

# Display
battery display: numeric
volume display: numeric
time format: 12hour

# Playback
replaygain type: track shuffle
replaygain noclip: on
cuesheet support: on
pause on headphone unplug: pause
rewind duration on pause: 2

# Library
tagcache_autoupdate: on
gather runtime data: on
show files: music

# Playlists
playlist viewer indices: off
playlist viewer track display: title from tags

# Power (old battery, spinning Microdrive)
backlight timeout: 10
backlight timeout plugged: 15
caption backlight: on
idle poweroff: 10
