# iPod Clean - large bold text, short main menu, friendly names
# For iPod mini (138x110, 4 greys). Pick it under
# Settings > Theme Settings > Browse Theme Files.
wps: /.rockbox/wps/podmod.wps
sbs: /.rockbox/wps/podmod.sbs
fms: -
selector type: bar (inverse)
backdrop: -
font: /.rockbox/fonts/15-Podmod-Helvetica-Bold.fnt
statusbar: off
iconset: /.rockbox/icons/tango_small_mono.bmp
viewers iconset: /.rockbox/icons/tango_small_viewers_mono.bmp
show icons: off
ui viewport: -
scrollbar: right
scrollbar width: 5
root menu order: database, playlists, wps, settings
lang: /.rockbox/langs/podmod.lng
show files: music
playlist viewer indices: off
playlist viewer track display: title from tags
